<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Exercise Video</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #f8f4fa; color: #4b2b63; }
    .container { max-width: 500px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 12px; }
    h2 { color: #743997; text-align: center; }
    label { font-weight: bold; }
    input, textarea, select { width: 100%; margin-bottom: 15px; padding: 8px; border-radius: 5px; border: 1px solid #dcbdf6; }
    button { background: #743997; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #a16ae8; }
    a { color: #743997; text-decoration: none; }
    video { margin-bottom: 10px; max-width: 100%; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Edit Exercise Video</h2>
    <form method="POST" enctype="multipart/form-data">
      <label>Title:</label>
      <input type="text" name="title" value="{{ exercise.title }}" required>
      <label>Description:</label>
      <textarea name="description">{{ exercise.description }}</textarea>
      <label>Trimester:</label>
      <select name="trimester" required>
        <option value="First" {% if exercise.trimester == 'First' %}selected{% endif %}>First</option>
        <option value="Second" {% if exercise.trimester == 'Second' %}selected{% endif %}>Second</option>
        <option value="Third" {% if exercise.trimester == 'Third' %}selected{% endif %}>Third</option>
      </select>
      <label>Current Video:</label><br>
      {% if exercise.video_path %}
        <video controls>
          <source src="{{ url_for('static', filename=exercise.video_path) }}">
        </video><br>
      {% endif %}
      <label>Change Video File:</label>
      <input type="file" name="video" accept="video/*">
      <button type="submit">Update Exercise Video</button>
    </form>
    <a href="{{ url_for('manage_wellness') }}">Back</a>
  </div>
</body>
</html>
