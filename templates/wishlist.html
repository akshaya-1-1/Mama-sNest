<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Wishlist - Mama's Nest</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background: #f3e5f5;
      margin: 0;
    }
    .top-nav {
      background: #B57EDC;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top-nav .logo-small {
      color: white;
      font-weight: bold;
      font-size: 1.3rem;
    }
    .top-nav .nav-icons a {
      color: white;
      font-size: 1.2rem;
      margin-left: 20px;
    }
    h2 {
      text-align: center;
      color: #5C2D91;
      margin-top: 30px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      padding: 30px;
    }
    .product-card {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }
    .product-image {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 8px;
    }
    .product-name {
      font-weight: 600;
      color: #392B5D;
      margin: 10px 0 5px;
    }
    .product-price {
      color: #7e57c2;
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #D8B4F8;
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }
    .btn:hover {
      background: #B57EDC;
    }
  </style>
</head>
<body>

<div class="top-nav">
  <div class="logo-small">Mama's Nest</div>
  <div class="nav-icons">
    <a href="{{ url_for('dashboard') }}"><i class="fas fa-home"></i></a>
    <a href="{{ url_for('cart') }}"><i class="fas fa-shopping-cart"></i></a>
    <a href="#"><i class="fas fa-user"></i></a>
  </div>
</div>

<h2>Your Wishlist</h2>

<div class="product-grid">
  {% for product in wishlist_items %}
  <div class="product-card">
    <img src="{{ url_for('static', filename=product.image) }}" alt="{{ product.name }}" class="product-image">
    <div class="product-name">{{ product.name }}</div>
    <div class="product-price">₹{{ product.price }}</div>
    <form method="POST" action="{{ url_for('add_to_cart') }}">
      <input type="hidden" name="name" value="{{ product.name }}">
      <button type="submit" class="btn">Add to Cart</button>
    </form>
  </div>
  {% endfor %}
</div>

</body>
</html>
