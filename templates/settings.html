<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Settings | Mama's Nest</title>
  <style>
    body { background: #f6edfa; color: #392b5d; font-family: 'Nunito', 'Poppins', sans-serif; min-height: 100vh; margin: 0;}
    nav { background: #b57edc; padding: 18px 36px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(90, 60, 120, 0.07);}
    nav .brand { color: #fff; font-weight: 700; font-size: 1.4rem; letter-spacing: 1px;}
    nav a { color: #fff; text-decoration: none; margin-left: 18px; font-size: 1rem; transition: color 0.2s;}
    nav a:hover { color: #f3e8ff;}
    .container { max-width: 600px; margin: 40px auto; padding: 0 20px;}
    h2 { color: #7c3aed; font-size: 2.2rem; font-weight: 800; margin-bottom: 28px; display: flex; align-items: center; gap: 10px;}
    form { background: #fff; border-radius: 12px; box-shadow: 0 4px 18px rgba(90, 60, 120, 0.08); padding: 32px; margin-bottom: 32px; display: flex; flex-direction: column; gap: 18px;}
    label { font-weight: 600; margin-bottom: 4px; color: #5c2d91;}
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d8b4f8; border-radius: 6px; font-size: 1rem; background: #faf5ff; color: #392b5d; margin-bottom: 10px; transition: border 0.2s;}
    input:focus, textarea:focus { border: 1.5px solid #7c3aed; outline: none;}
    button { background: #7c3aed; color: #fff; border: none; border-radius: 6px; padding: 12px 0; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 8px; transition: background 0.2s;}
    button:hover { background: #5c2d91;}
    .section-title { font-size: 1.2rem; font-weight: 700; color: #5c2d91; margin-bottom: 10px; margin-top: 18px; display: flex; align-items: center; gap: 8px;}
    .back-link { display: inline-block; margin-top: 24px; background: #f3e8ff; color: #7c3aed; border-radius: 6px; padding: 10px 20px; text-decoration: none; font-size: 1rem; font-weight: 600; transition: background 0.2s, color 0.2s;}
    .back-link:hover { background: #d8b4f8; color: #392b5d;}
    @media (max-width: 600px) { .container { padding: 0 6px; } h2 { font-size: 1.3rem; } form { padding: 16px; } }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/js/all.min.js"></script>
</head>
<body>
  <nav>
    <div class="brand">Mama's Nest</div>
    <div>
      <a href="{{ url_for('dashboard') }}"><i class="fas fa-home"></i> Home</a>
      <a href="{{ url_for('my_account') }}"><i class="fas fa-user-circle"></i> My Account</a>
      <a href="{{ url_for('logout') }}"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
  </nav>
  <div class="container">
    <h2><span>⚙️</span> Account Settings</h2>
    <form method="POST">
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ user.name }}" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ user.email }}" required>
      </div>
      <div>
        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone" value="{{ user.phone or '' }}">
      </div>
      <div>
        <label for="address">Address</label>
        <textarea id="address" name="address">{{ user.address or '' }}</textarea>
      </div>
      <button type="submit">Save Changes</button>
    </form>
    <div id="password">
      <div class="section-title"><i class="fas fa-key"></i> Change Password</div>
      <form method="POST" action="{{ url_for('settings') }}#password">
        <div>
          <label for="current_password">Current Password</label>
          <input type="password" id="current_password" name="current_password" required>
        </div>
        <div>
          <label for="new_password">New Password</label>
          <input type="password" id="new_password" name="new_password" required>
        </div>
        <div>
          <label for="confirm_password">Confirm New Password</label>
          <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <button type="submit">Change Password</button>
      </form>
    </div>
    <a href="{{ url_for('my_account') }}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Account</a>
  </div>
</body>
</html>
