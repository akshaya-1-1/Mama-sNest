<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Settings | Mama's Nest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #fff9fd;
      color: #4b2b63;
    }

    header {
      background: linear-gradient(to right, #dcbdf6, #f3e6fc);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    nav a {
      color: #5a3c75;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 600;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.08);
    }

    h2 {
      color: #732b9d;
      text-align: center;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #d3b8ec;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .btn {
      background-color: #a15ec6;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: #843ab5;
    }

    .note {
      font-size: 0.9em;
      color: #777;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Admin Settings</h1>
    <nav>
      <a href="/admin-dashboard">Dashboard</a>
      <a href="/logout">Logout</a>
    </nav>
  </header>

  <div class="container">
    <h2>Update Admin Details</h2>

    <form method="POST" action="/admin/settings">
      <div class="form-group">
        <label for="email">Admin Email (optional)</label>
        <input type="text" id="email" name="email" placeholder="example@domain.com">
      </div>

      <div class="form-group">
        <label for="current_password">Current Password</label>
        <input type="password" id="current_password" name="current_password" required>
      </div>

      <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" required>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
      </div>

      <button class="btn" type="submit">Update Password</button>

      <p class="note">* Only password is required. Updating email is optional.</p>
    </form>
  </div>

</body>
</html>
