<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mom's Circle – Stories & Ratings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .star {
      cursor: pointer;
      font-size: 1.5rem;
      color: #e5e7eb;
      transition: color 0.2s ease;
    }
    .star.active {
      color: #facc15;
    }
    body {
      background-color: #f3e8ff; /* light lavender */
    }
  </style>
</head>
<body class="text-gray-800 font-sans">

  <div class="max-w-4xl mx-auto px-4 py-10">
    <h2 class="text-4xl font-bold text-purple-700 mb-6 text-center">🤱 Mom’s Circle – Shared Journeys & Reviews</h2>

    <!-- Form Section -->
    <form action="{{ url_for('add_story') }}" method="POST" class="space-y-4 mb-10 bg-white p-6 rounded-xl shadow">
      <h3 class="text-2xl font-semibold text-purple-700 mb-4">💬 Share Your Experience</h3>

      <div>
        <label class="block text-sm font-medium text-gray-700">Your Name</label>
        <input type="text" name="name" placeholder="e.g., Sneha"
               class="mt-1 w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-400" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Your Experience</label>
        <textarea name="content" rows="4" placeholder="Share your thoughts or story here..."
                  class="mt-1 w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-purple-400"></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Star Rating</label>
        <div id="starRating" class="flex space-x-1">
          <span class="star" data-value="1">★</span>
          <span class="star" data-value="2">★</span>
          <span class="star" data-value="3">★</span>
          <span class="star" data-value="4">★</span>
          <span class="star" data-value="5">★</span>
        </div>
        <input type="hidden" name="rating" id="ratingInput">
      </div>

      <button type="submit"
              class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg shadow">
        Share Story
      </button>
    </form>

    <!-- Stories List -->
    <div id="storyList" class="space-y-6"></div>
  </div>

  <script>
    let stories = JSON.parse('{{ stories_json | safe }}');

    const ratingInput = document.getElementById('ratingInput');
    const starRating = document.getElementById('starRating');
    let currentRating = 0;

    // Star Rating Interaction
    const starElements = starRating.querySelectorAll('.star');
    starElements.forEach(star => {
      star.addEventListener('click', () => {
        currentRating = parseInt(star.getAttribute('data-value'));
        ratingInput.value = currentRating;
        updateStarUI();
      });
    });

    function updateStarUI() {
      starElements.forEach(star => {
        const value = parseInt(star.getAttribute('data-value'));
        star.classList.toggle('active', value <= currentRating);
      });
    }

    function renderStars(rating) {
      return "⭐".repeat(rating);
    }

    function renderStories() {
      const storyList = document.getElementById('storyList');
      storyList.innerHTML = "";
      stories.forEach((story, index) => {
        const card = document.createElement("div");
        card.className = "bg-white p-6 rounded-xl shadow relative";

        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <h3 class="text-lg font-bold text-purple-700">${story.name}</h3>
              <div class="text-yellow-400 text-xl">${renderStars(story.rating)}</div>
            </div>
          </div>
          <p class="text-gray-700">${story.content}</p>
        `;
        storyList.appendChild(card);
      });
    }

    renderStories();
  </script>
</body>
</html>
