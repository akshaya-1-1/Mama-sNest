<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Product</title>
  <style>
    body { background-color: #f9f1f7; font-family: 'Segoe UI'; }
    .form-box {
      width: 50%; margin: 40px auto; background: #fff;
      padding: 30px; border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    input, textarea {
      width: 100%; padding: 10px; margin: 10px 0;
      border-radius: 6px; border: 1px solid #ccc;
    }
    button {
      background: #6f42c1; color: white; border: none;
      padding: 10px 20px; border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Edit Product</h2>
    <form method="POST" enctype="multipart/form-data">
      <label>Name</label>
      <input type="text" name="name" value="{{ product.name }}" required>

      <label>Category</label>
      <input type="text" name="category" value="{{ product.category }}" required>

      <label>Price</label>
      <input type="number" step="0.01" name="price" value="{{ product.price }}" required>

      <label>Original Price</label>
      <input type="number" step="0.01" name="original_price" value="{{ product.original_price or '' }}">

      <label>Discount (%)</label>
      <input type="number" name="discount" value="{{ product.discount or '' }}">

      <label>Sizes</label>
      <input type="text" name="sizes" value="{{ product.sizes or '' }}">

      <label>Description</label>
      <textarea name="description">{{ product.description or '' }}</textarea>

      <label>Replace Image (optional)</label>
      <input type="file" name="image">

      <button type="submit">Update Product</button>
    </form>
  </div>
</body>
</html>
