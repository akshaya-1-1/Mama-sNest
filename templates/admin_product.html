<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Product Management | Admin - Mama's Nest</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #fff9fd;
      color: #4b2b63;
      padding: 40px;
    }

    h2 {
      text-align: center;
      color: #732b9d;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 0 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    th, td {
      padding: 12px 16px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f6ebfc;
      color: #4b2b63;
    }

    tr:hover {
      background-color: #f9f2fc;
    }

    .btn {
      padding: 6px 14px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      margin-right: 5px;
    }

    .edit-btn {
      background-color: #e0bbf7;
      color: #4b2b63;
    }

    .delete-btn {
      background-color: #ffc2c2;
      color: #902020;
    }

    .add-btn {
      background-color: #a15ec6;
      color: white;
      display: inline-block;
      margin-bottom: 20px;
    }

    .product-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <h2>🛍️ Product Management</h2>

  <a href="{{ url_for('add_new_product') }}">
  <button style="background-color:#a74cb8; color:white; padding:10px 20px; border-radius:6px; border:none;">
    ➕ Add New Product
  </button>
</a>


  <table>
    <thead>
      <tr>
        <th>Image</th>
        <th>Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>Discount</th>
        <th>Sizes</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for product in products %}
      <tr>
        <td><img src="{{ url_for('static', filename=product.image) }}" class="product-img" /></td>
        <td>{{ product.name }}</td>
        <td>{{ product.category }}</td>
        <td>₹{{ product.price }}</td>
        <td>{{ product.discount or 0 }}%</td>
        <td>{{ product.sizes or '-' }}</td>
        <td>
  <a href="{{ url_for('edit_product', product_id=product.id) }}">
    <button style="background-color:#c49fff; border:none; padding:5px 12px; border-radius:5px;">Edit</button>
  </a>
  <form action="{{ url_for('delete_product', product_id=product.id) }}" method="POST" style="display:inline;">
    <button type="submit" onclick="return confirm('Are you sure you want to delete this product?');"
      style="background-color:#ffb0b0; border:none; padding:5px 12px; border-radius:5px;">
      Delete
    </button>
  </form>
</td>

      </tr>
      {% endfor %}
    </tbody>
  </table>

</body>
</html>
